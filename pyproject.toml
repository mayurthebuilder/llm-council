[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-council"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13,<3", "typer>=0.27,<1", "rich>=15,<16"]

[project.optional-dependencies]
google = ["google-genai>=2.20,<3"]
dev = [
    "build>=1.6,<2",
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16,<1",
]

[project.scripts]
llm-council = "llm_council.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["llm_council"]
