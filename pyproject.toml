[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-council"
version = "1.0.0"
description = "A privacy-conscious multi-agent decision-support CLI for digital marketing, SEO, AEO, and GEO"
readme = "README.md"
license = "MIT"
authors = [{ name = "mayurthebuilder" }]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13,<3", "typer>=0.27,<1", "rich>=15,<16"]
keywords = ["digital-marketing", "llm", "seo", "aeo", "geo", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mayurthebuilder/llm-council"
Repository = "https://github.com/mayurthebuilder/llm-council"
Issues = "https://github.com/mayurthebuilder/llm-council/issues"

[project.optional-dependencies]
google = ["google-genai>=2.20,<3"]
dev = [
    "build>=1.6,<2",
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16,<1",
]

[project.scripts]
llm-council = "llm_council.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_council = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["llm_council"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["llm_council"]
