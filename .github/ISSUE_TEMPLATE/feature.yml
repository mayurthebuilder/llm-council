name: Feature request
description: Propose an evidence-backed improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Marketing or engineering problem
      description: Explain the decision or safety gap, not only the proposed solution.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and current limitations
      description: Cite public sources or reproducible behavior; distinguish facts from assumptions.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and test plan
    validations:
      required: true
  - type: checkboxes
    id: guarantees
    attributes:
      label: Claims
      options:
        - label: This request makes no unsupported ranking, citation, traffic, lead, revenue, diversity, or accuracy claim.
          required: true
