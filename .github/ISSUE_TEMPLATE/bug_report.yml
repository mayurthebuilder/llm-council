name: Bug report
description: Report a reproducible defect without sharing private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste API keys, private context, personal identifiers, or provider responses.
  - type: input
    id: version
    attributes:
      label: Revision or version
      placeholder: Commit SHA or version
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider mode
      options: [Offline demo, Google adapter, Not provider-related]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Sanitized reproduction
      description: Use fictional inputs and list the smallest steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private context, personal data, local user paths, and session identifiers.
          required: true
